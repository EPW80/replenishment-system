# Local development database only. Production runs on Hetzner via Coolify.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cadenceos
      POSTGRES_PASSWORD: cadenceos
      POSTGRES_DB: cadenceos_dev
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadenceos"]
      interval: 5s
      timeout: 5s
      retries: 10
