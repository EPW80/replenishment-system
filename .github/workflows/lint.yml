name: Lint

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # for actions/checkout, nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      # Go comes from the runner image plus the toolchain directive in go.mod.
      # No setup-* action: see docs/RECOMMENDED_ACTIONS.md.
      - name: Report Go version
        run: go version

      - name: Lint
        run: make lint
