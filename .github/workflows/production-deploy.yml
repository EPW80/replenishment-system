name: Production deploy

on:
  workflow_call:
    inputs:
      commit-sha:
        description: Full 40-character commit SHA to deploy.
        required: true
        type: string
      approved-sha:
        description: >-
          The commit_sha from the release metadata record. Read it from the record,
          never retype it -- this check compares two values handed to the run, so it
          cannot catch an operator who enters the same wrong SHA twice.
        required: true
        type: string
      environment:
        description: GitHub Environment name. Its required reviewers are the business-approval gate.
        required: false
        type: string
        default: production
    outputs:
      url:
        description: URL the deployment is serving on, for the health check.
        value: ${{ jobs.production-deploy.outputs.url }}

permissions: {}

jobs:
  production-deploy:
    name: Production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read   # for actions/checkout, nothing else
      # id-token: write   # uncomment if the provider supports OIDC
    # Binding this environment IS the business-approval gate: GitHub pauses the run
    # before any step below executes and waits for a named reviewer to approve.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # THE authoritative gate. deploy.yml's validate job only fails faster.
      # Keep this: it is what makes an approval refer to specific bytes.
      - name: Verify the deploy target matches the approved SHA
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
          APPROVED_SHA: ${{ inputs.approved-sha }}
        run: |
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::commit-sha must be a full 40-character lowercase hex SHA"
            exit 1
          fi
          if ! printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::approved-sha must be a full 40-character lowercase hex SHA"
            exit 1
          fi
          if [ "$COMMIT_SHA" != "$APPROVED_SHA" ]; then
            echo "::error::Refusing to deploy. commit-sha does not match the approved SHA in the release record."
            exit 1
          fi
          echo "Deploy target matches the approved SHA."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false

      # Same mechanism as staging-deploy.yml; read the notes there on why migrations
      # do not run on this runner and on what the webhook actually deploys.
      #
      # ON REBUILDING: the stub this replaced asked for the artifact verified on
      # staging to be promoted, because rebuilding means production runs a build
      # nobody tested. Coolify's deploy webhook builds from git rather than promoting
      # an image, so this rebuilds the same source instead. That is a real, accepted
      # deviation, not an oversight: the inputs are identical (same commit, same
      # Dockerfile, pinned base images), and the guard against a build that differs
      # anyway is production-health-check asserting the served commit. Promoting a
      # registry image is the better shape if this ever moves to one.
      #
      # If the release includes a migration it is applied by the Coolify
      # pre-deployment command, and the record's database_migration and rollback_safe
      # values must already reflect that.
      - name: Deploy to production
        id: deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -u
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_DEPLOY_WEBHOOK_URL is not set on this Environment."
            exit 1
          fi
          if [ -z "$API_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN is not set on this Environment."
            exit 1
          fi
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL variable is not set on this Environment. The health check has no target without it."
            exit 1
          fi

          # curl still prints %{http_code} (as 000) when the connection itself fails,
          # so the fallback assigns rather than appends -- "|| echo 000" would
          # concatenate onto that and report a nonsense 000000.
          BODY_FILE="$(mktemp)"
          CODE="$(curl -sS -o "$BODY_FILE" -w '%{http_code}' --max-time 60 \
            -X POST -H "Authorization: Bearer $API_TOKEN" "$WEBHOOK_URL" 2>>"$BODY_FILE")" || CODE=000

          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ] && [ "$CODE" != "202" ]; then
            echo "::error::Coolify deploy webhook returned HTTP $CODE"
            sed -n '1,20p' "$BODY_FILE"
            exit 1
          fi
          echo "Deployment queued (HTTP $CODE)."
          echo "url=$APP_URL" >> "$GITHUB_OUTPUT"
