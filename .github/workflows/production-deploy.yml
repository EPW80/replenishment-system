name: Production deploy

on:
  workflow_call:
    inputs:
      commit-sha:
        description: Full 40-character commit SHA to deploy.
        required: true
        type: string
      approved-sha:
        description: >-
          The commit_sha from the release metadata record. Read it from the record,
          never retype it -- this check compares two values handed to the run, so it
          cannot catch an operator who enters the same wrong SHA twice.
        required: true
        type: string
      environment:
        description: GitHub Environment name. Its required reviewers are the business-approval gate.
        required: false
        type: string
        default: production
    outputs:
      url:
        description: URL the deployment is serving on, for the health check.
        value: ${{ jobs.production-deploy.outputs.url }}

permissions: {}

jobs:
  production-deploy:
    name: Production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read   # for actions/checkout, nothing else
      # id-token: write   # uncomment if the provider supports OIDC
    # Binding this environment IS the business-approval gate: GitHub pauses the run
    # before any step below executes and waits for a named reviewer to approve.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # THE authoritative gate. deploy.yml's validate job only fails faster.
      # Keep this: it is what makes an approval refer to specific bytes.
      - name: Verify the deploy target matches the approved SHA
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
          APPROVED_SHA: ${{ inputs.approved-sha }}
        run: |
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::commit-sha must be a full 40-character lowercase hex SHA"
            exit 1
          fi
          if ! printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::approved-sha must be a full 40-character lowercase hex SHA"
            exit 1
          fi
          if [ "$COMMIT_SHA" != "$APPROVED_SHA" ]; then
            echo "::error::Refusing to deploy. commit-sha does not match the approved SHA in the release record."
            exit 1
          fi
          echo "Deploy target matches the approved SHA."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false

      # Pin the application to the approved commit before queueing the deployment.
      # A bare deploy webhook builds the current branch tip, which can move between
      # approval and this step; git_commit_sha makes the deploy target immutable.
      #
      # If the release includes a migration it is applied by the Coolify
      # pre-deployment command, and the record's database_migration and rollback_safe
      # values must already reflect that.
      - name: Deploy to production
        id: deploy
        env:
          API_URL: ${{ vars.COOLIFY_API_URL }}
          APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          set -eu
          if [ -z "$API_URL" ]; then
            echo "::error::COOLIFY_API_URL is not set on this Environment."
            exit 1
          fi
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::COOLIFY_API_URL must use HTTPS."; exit 1 ;;
          esac
          if ! printf '%s' "$APPLICATION_UUID" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::COOLIFY_APPLICATION_UUID is missing or invalid."
            exit 1
          fi
          if [ -z "$API_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN is not set on this Environment."
            exit 1
          fi
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL variable is not set on this Environment. The health check has no target without it."
            exit 1
          fi

          API_URL="${API_URL%/}"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT

          CODE="$(curl -sS -o "$BODY_FILE" -w '%{http_code}' --max-time 60 \
            -X PATCH \
            -H "Authorization: Bearer $API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"git_commit_sha\":\"$COMMIT_SHA\"}" \
            "$API_URL/applications/$APPLICATION_UUID" 2>>"$BODY_FILE")" || CODE=000

          if [ "$CODE" != "200" ]; then
            echo "::error::Coolify could not pin the application to the approved commit (HTTP $CODE)"
            sed -n '1,20p' "$BODY_FILE"
            exit 1
          fi

          : > "$BODY_FILE"
          CODE="$(curl -sS -o "$BODY_FILE" -w '%{http_code}' --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"uuid\":\"$APPLICATION_UUID\",\"force\":true}" \
            "$API_URL/deploy" 2>>"$BODY_FILE")" || CODE=000
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ] && [ "$CODE" != "202" ]; then
            echo "::error::Coolify deploy API returned HTTP $CODE"
            sed -n '1,20p' "$BODY_FILE"
            exit 1
          fi
          echo "Approved commit $COMMIT_SHA pinned and deployment queued (HTTP $CODE)."
          echo "url=$APP_URL" >> "$GITHUB_OUTPUT"
