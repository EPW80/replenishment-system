name: Staging deploy

on:
  workflow_call:
    inputs:
      commit-sha:
        description: Full 40-character commit SHA to deploy.
        required: true
        type: string
      environment:
        description: GitHub Environment name holding the deploy credentials.
        required: false
        type: string
        default: staging
    outputs:
      url:
        description: URL the deployment is serving on, for the health check.
        value: ${{ jobs.staging-deploy.outputs.url }}

permissions: {}

jobs:
  staging-deploy:
    name: Staging deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read   # for actions/checkout, nothing else
      # id-token: write   # uncomment if the provider supports OIDC -- preferred over
                          # a stored token, since it leaves no standing credential
    # This job binds the environment, so it can read Environment-scoped secrets.
    # deploy.yml CANNOT forward them: a job calling a reusable workflow may not declare
    # environment:, and an unset secret resolves to an empty string with no error.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # Functional guard -- keep it. Deploy targets are always full SHAs, never
      # branches or tags, because a branch moves and an approval must not.
      - name: Validate commit SHA
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::commit-sha must be a full 40-character lowercase hex SHA, got: $COMMIT_SHA"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false

      # Triggers a Coolify deployment for this application and hands the health check
      # a URL to probe. It does not wait for the rollout: the webhook returns as soon
      # as the deployment is queued, and staging-health-check polls until the endpoint
      # reports the expected SHA, which is the real completion signal.
      #
      # MIGRATIONS DO NOT RUN HERE, deliberately. Applying them from this runner would
      # mean the production database accepts connections from GitHub's IP ranges and a
      # long-lived DATABASE_URL lives as a GitHub secret -- the exact exposure ADR 0011
      # rejected for the nightly jobs. `migrate` runs as a Coolify pre-deployment
      # command inside the deployment's own network, where the credential already is.
      # See docs/SCHEDULED_JOBS.md and docs/adr/0011.
      #
      # WHAT THIS DEPLOYS: the webhook builds whatever commit the branch Coolify tracks
      # currently points at -- it does not take a SHA. That is why the health check
      # asserts on expected-sha rather than trusting this step's exit code: if the tip
      # moved, or the build was stale, the probe reports a different commit and the
      # gate fails. Keep Coolify pointed at the branch being deployed.
      #
      # Values reach the shell through env, never interpolated into the run: script --
      # interpolation happens before the shell sees the line. See docs/WORKFLOWS.md.
      - name: Deploy to staging
        id: deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -u
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_DEPLOY_WEBHOOK_URL is not set on this Environment."
            exit 1
          fi
          if [ -z "$API_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN is not set on this Environment."
            exit 1
          fi
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL variable is not set on this Environment. The health check has no target without it."
            exit 1
          fi

          # curl still prints %{http_code} (as 000) when the connection itself fails,
          # so the fallback assigns rather than appends -- "|| echo 000" would
          # concatenate onto that and report a nonsense 000000.
          BODY_FILE="$(mktemp)"
          CODE="$(curl -sS -o "$BODY_FILE" -w '%{http_code}' --max-time 60 \
            -X POST -H "Authorization: Bearer $API_TOKEN" "$WEBHOOK_URL" 2>>"$BODY_FILE")" || CODE=000

          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ] && [ "$CODE" != "202" ]; then
            echo "::error::Coolify deploy webhook returned HTTP $CODE"
            sed -n '1,20p' "$BODY_FILE"
            exit 1
          fi
          echo "Deployment queued (HTTP $CODE)."
          echo "url=$APP_URL" >> "$GITHUB_OUTPUT"
