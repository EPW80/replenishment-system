name: Feature
description: New capability or a change to existing behaviour.
labels: ["feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need does this serve? Describe the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: input
    id: spec-ref
    attributes:
      label: Spec reference
      description: Which section of docs/replenishment-service-spec.md does this implement?
      placeholder: "e.g. §6 state transitions"
    validations:
      required: false
  - type: checkboxes
    id: compliance
    attributes:
      label: Compliance boundary
      description: >-
        Spec §2 is a hard constraint. The service stores interval_days and nothing
        implying consumption — no usage rates, doses remaining, supply projections,
        adherence tracking, intake logs, or per-compound cadence recommendations.
        Copy rule: "when to reorder," never "when to take."
      options:
        - label: This change stores, computes, infers and displays nothing that implies consumption.
          required: true
  - type: textarea
    id: open-questions
    attributes:
      label: Open decisions this depends on
      description: >-
        Spec §11 lists decisions still open (payment vaulting, discount, affiliate
        commission on rebills, default cadence, pre-billing window, failed-schedule
        retention, address changes). Does this need one resolved first?
    validations:
      required: false
