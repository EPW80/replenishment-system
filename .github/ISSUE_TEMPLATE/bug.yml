name: Bug report
description: Something behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** report a security vulnerability here — see [`SECURITY.md`](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit SHA or deployed version
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Where
      options: [local, staging, production]
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: >-
        Does this affect billing, order creation, or a customer-facing surface?
        A duplicate charge or a missed skip window is urgent; note it here.
    validations:
      required: false
